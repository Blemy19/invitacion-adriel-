<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 670" role="img" aria-labelledby="title desc">
<title id="title">Animador de fiesta sonriente con lentes naranjas</title>
<desc id="desc">Personaje original de caricatura con gorra azul y naranja, camisa azul y tirantes naranjas, saludando.</desc>
<defs>
<linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#61d6ff"/><stop offset="1" stop-color="#0876dc"/></linearGradient>
<linearGradient id="cap" x1="0" x2="1"><stop stop-color="#ffac23"/><stop offset="1" stop-color="#ff6417"/></linearGradient>
