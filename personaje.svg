<linearGradient id="pants" x1="0" x2="1"><stop stop-color="#536f91"/><stop offset="1" stop-color="#2e486c"/></linearGradient>
<filter id="shadow" x="-.4" y="-.4" width="1.8" height="1.8"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#07599f" flood-opacity=".22"/></filter>
</defs>
